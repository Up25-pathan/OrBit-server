name: Keep Server Alive

on:
  schedule:
    # Every 14 minutes (Render free tier spins down after 15 min idle)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server health endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://orbit-server-kae6.onrender.com/api/v1/health || true
