name: Keep Server Alive

on:
  schedule:
    # Every 5 minutes — Render free tier spins down after ~15 min idle, and GitHub
    # Actions cron is often delayed several minutes, so the old 14-min cadence
    # let the instance fall asleep (causing 15s client timeouts / "unable to connect").
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping server health endpoint
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://orbit-server-kae6.onrender.com/api/v1/health || true
